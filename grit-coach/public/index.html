<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#100C0B" />
    <meta name="description" content="GRIT Performance Co. — Coach Assessment System" />
    <title>GRIT Performance Co. — Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #100C0B; color: #F5F0EE; font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-thumb { background: #2A2220; border-radius: 2px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
      input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.4); }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
